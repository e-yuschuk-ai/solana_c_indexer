services:
  indexer:
    # Builds with UID/GID 1000 by default (see Dockerfile). On Linux hosts
    # where that does not match your user, override once with:
    #   docker compose build --build-arg UID=$(id -u) --build-arg GID=$(id -g)
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    # run.sh reads ./.env itself when the file is present (see README.md),
    # so no env_file entry is needed here.
    command: ["./run.sh"]
    # The confirmed tier (decision D4). Point the storage tests at it with:
    #   IDX_TEST_PG_CONNINFO="host=postgres port=5432 user=indexer \
    #     password=indexer dbname=indexer"
    environment:
      IDX_TEST_PG_CONNINFO: "host=postgres port=5432 user=indexer password=indexer dbname=indexer"
      IDX_TEST_CH_URL: "http://clickhouse:8123"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # PostgreSQL for the confirmed tier (decision D4). This is the server the
  # storage tests run against; the test host only needs libpq (libpq-dev). Data
  # lives in a named volume so a restart keeps it, and `docker compose down -v`
  # discards it for a clean slate.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer
    ports:
      # Host 5433 avoids clashing with a PostgreSQL already on the default
      # 5432; inside the compose network the port is still 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ClickHouse for the finalized tier (decision D4). The storage tests reach it
  # over the HTTP interface (port 8123); 9000 is the native protocol, exposed
  # for a clickhouse-client shell. Data lives in a named volume.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    # Left with the built-in `default` user and no password, which is what the
    # ch client connects as by default; the tests target the default database.
    environment:
      # Without this the image's entrypoint, finding neither CLICKHOUSE_USER
      # nor CLICKHOUSE_PASSWORD set, writes a users.d drop-in that restricts
      # `default` to the loopback interface — every connection from the host or
      # from another container is then refused as AUTHENTICATION_FAILED.
      # Skipping that setup keeps the built-in passwordless `default` reachable,
      # which is what the ch client and the tests expect.
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
